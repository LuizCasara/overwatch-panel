<!doctype html>
<html lang="pt-br" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-overwatch</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --panel-bg: rgba(18, 24, 32, 0.55);
    --panel-border: rgba(120, 170, 220, 0.18);
    --text-primary: #d8e6f2;
    --text-dim: #7c8ba0;
    --mono: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

    --status-running: #35b6ff;
    --status-done: #3ddc84;
    --status-waiting: #f2c94c;
    --status-idle: #9aa7b8;
    --status-error: #ff5d5d;
    --status-ended: #4a5566;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(circle at 20% -10%, #10202e 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: var(--mono);
    padding: 24px 16px 48px;
    min-height: 100vh;
  }

  .wrap { max-width: 1200px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 18px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text-primary);
  }

  h1 .glow { color: var(--status-running); text-shadow: 0 0 12px rgba(53, 182, 255, 0.6); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }

  .blip {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }

  .blip.pulsing { animation: pulse 1.6s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.82); }
  }

  .blip.running { background: var(--status-running); box-shadow: 0 0 8px var(--status-running); }
  .blip.done { background: var(--status-done); box-shadow: 0 0 8px var(--status-done); }
  .blip.waiting { background: var(--status-waiting); box-shadow: 0 0 8px var(--status-waiting); }
  .blip.idle { background: var(--status-idle); }
  .blip.error { background: var(--status-error); box-shadow: 0 0 8px var(--status-error); }
  .blip.ended { background: var(--status-ended); }

  #empty-state, #config-missing {
    border: 1px dashed var(--panel-border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  #config-missing code {
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text-primary);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    --accent: var(--panel-border);
    position: relative;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.02),
      0 12px 30px -18px rgba(0, 0, 0, 0.7),
      -10px 0 22px -12px var(--accent);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    flex-wrap: wrap;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .card-header .project { color: var(--text-primary); font-weight: 700; }
  .card-header .sep { opacity: 0.4; }

  .card-summary {
    font-size: 13px;
    color: var(--text-primary);
    margin-bottom: 12px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .overall-bar {
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    margin-bottom: 12px;
  }

  .overall-bar > i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--status-running), var(--status-done));
  }

  .todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  .todo {
    font-size: 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    color: var(--text-dim);
  }

  .todo .mark { flex: none; margin-top: 2px; }
  .todo.completed { color: var(--text-primary); text-decoration: line-through; opacity: 0.6; }
  .todo.in_progress { color: var(--text-primary); }

  .sub-progress {
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.08);
    margin-top: 4px;
    overflow: hidden;
  }

  .sub-progress > i { display: block; height: 100%; background: var(--status-waiting); }

  .badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
  }
  .badge.feature { color: var(--status-running); border-color: rgba(53, 182, 255, 0.45); }
  .badge.bugfix { color: var(--status-waiting); border-color: rgba(242, 201, 76, 0.45); }
  .slug { color: var(--text-primary); }

  .flow {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
    margin-bottom: 12px;
    font-size: 11px;
  }
  .flow .step { color: var(--text-dim); opacity: 0.55; }
  .flow .step.done { color: var(--status-done); opacity: 1; }
  .flow .step.current {
    color: var(--status-running);
    opacity: 1;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(53, 182, 255, 0.5);
  }
  .flow .arrow { color: var(--text-dim); opacity: 0.3; }

  .agents {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 11px;
  }
  .agent { display: flex; gap: 8px; align-items: baseline; color: var(--text-dim); }
  .agent .type { color: var(--text-primary); }
  .agent.done { opacity: 0.55; }
  .agent .desc { overflow-wrap: anywhere; }
  .meta-line { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }
  .meta-line b { color: var(--text-primary); font-weight: 400; }

  .rm-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 11px;
  }
  .chip {
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .chip.rm { color: var(--text-primary); font-weight: 700; }
  .chip.st-working { color: var(--status-running); border-color: rgba(53, 182, 255, 0.45); }
  .chip.st-validando { color: var(--status-waiting); border-color: rgba(242, 201, 76, 0.45); }
  .chip.st-done { color: var(--status-done); border-color: rgba(61, 220, 132, 0.45); }
  .chip.ok { color: var(--status-done); border-color: rgba(61, 220, 132, 0.45); }
  .chip.partial { color: var(--status-waiting); border-color: rgba(242, 201, 76, 0.45); }
  .chip.none { opacity: 0.6; }
  .chip.complete {
    color: #05070a;
    background: var(--status-done);
    border-color: var(--status-done);
    font-weight: 700;
  }

  section.archived {
    margin-top: 40px;
    opacity: 0.5;
  }

  section.archived h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  @media (max-width: 480px) {
    body { padding: 16px 12px 32px; }
    .card-header { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="glow">●</span> claude-overwatch</h1>
    <div class="legend">
      <span class="legend-item"><span class="blip running pulsing"></span> rodando</span>
      <span class="legend-item"><span class="blip done"></span> concluido</span>
      <span class="legend-item"><span class="blip waiting pulsing"></span> aguardando voce</span>
      <span class="legend-item"><span class="blip idle"></span> ocioso</span>
      <span class="legend-item"><span class="blip error"></span> erro</span>
      <span class="legend-item"><span class="blip ended"></span> encerrada</span>
    </div>
  </header>

  <div id="config-missing" hidden>
    Configuracao nao encontrada. Rode <code>node install.mjs</code> na raiz do repositorio e recarregue esta pagina.
  </div>

  <div id="empty-state" hidden>Nenhuma sessao registrada ainda.</div>

  <main id="active-grid" class="grid"></main>

  <section class="archived" hidden>
    <h2>Arquivadas</h2>
    <div id="archived-grid" class="grid"></div>
  </section>
</div>
<script src="panel-config.js"></script>
<script src="format.js"></script>
<script>
(function () {
  'use strict';

  var POLL_MS = 30000;
  var activeGrid = document.getElementById('active-grid');
  var archivedGrid = document.getElementById('archived-grid');
  var archivedSection = document.querySelector('section.archived');
  var emptyState = document.getElementById('empty-state');
  var configMissing = document.getElementById('config-missing');

  var STATUS_LABEL = {
    running: 'rodando',
    waiting: 'aguardando voce',
    idle: 'ocioso',
    error: 'erro',
    ended: 'encerrada',
  };

  var STATUS_BLIP_CLASS = {
    running: 'running pulsing',
    waiting: 'waiting pulsing',
    idle: 'idle',
    error: 'error',
    ended: 'ended',
  };

  var STATUS_ACCENT_VAR = {
    running: 'var(--status-running)',
    waiting: 'var(--status-waiting)',
    idle: 'var(--status-idle)',
    error: 'var(--status-error)',
    ended: 'var(--status-ended)',
  };

  function escapeHtml(value) {
    var div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function renderTodoItem(todo) {
    var li = document.createElement('li');
    var status = todo && todo.status;
    li.className = 'todo' + (status ? ' ' + status : '');
    var mark = status === 'completed' ? '✔' : status === 'in_progress' ? '▸' : '○';
    var sub = todo && todo.total > 0
      ? { done: todo.checked || 0, total: todo.total }
      : window.OverwatchFormat.extractSubProgress(todo && todo.content);
    var subHtml = '';
    if (sub && sub.total > 0) {
      var pct = Math.round((sub.done / sub.total) * 100);
      subHtml = '<div class="sub-progress"><i style="width:' + pct + '%"></i></div>';
    }
    li.innerHTML =
      '<span class="mark">' + mark + '</span><span>' + escapeHtml(todo && todo.content) + subHtml + '</span>';
    return li;
  }

  var KIND_LABEL = { feature: 'feature', bugfix: 'bugfix' };

  function renderFlow(flow) {
    var div = document.createElement('div');
    div.className = 'flow';
    var parts = [];
    flow.forEach(function (step, i) {
      var mark = step.state === 'done' ? '✔ ' : step.state === 'current' ? '▸ ' : '';
      if (i > 0) parts.push('<span class="arrow">→</span>');
      parts.push('<span class="step ' + escapeHtml(step.state) + '">' + mark + escapeHtml(step.label) + '</span>');
    });
    div.innerHTML = parts.join('');
    return div;
  }

  function renderAgents(agents) {
    var running = agents.filter(function (a) { return a.status === 'running'; });
    var finished = agents.filter(function (a) { return a.status !== 'running'; }).slice(-3);
    var ul = document.createElement('ul');
    ul.className = 'agents';
    running.concat(finished).forEach(function (a) {
      var li = document.createElement('li');
      li.className = 'agent ' + (a.status === 'running' ? 'running' : 'done');
      var blip = a.status === 'running' ? 'running pulsing' : 'done';
      var text = a.description || a.summary || '';
      var elapsed = a.status === 'running' ? ' · ' + window.OverwatchFormat.formatElapsed(a.started_at) : '';
      li.innerHTML =
        '<span class="blip ' + blip + '"></span>' +
        '<span class="type">' + escapeHtml(a.type) + '</span>' +
        '<span class="desc">' + escapeHtml(text) + escapeHtml(elapsed) + '</span>';
      ul.appendChild(li);
    });
    return ul;
  }

  var RM_STATUS_CLASS = {
    WORKING: 'st-working',
    VALIDANDO: 'st-validando',
    DONE: 'st-done',
  };

  function repoChip(label, repo) {
    var state = repo && repo.state;
    var pr = repo && repo.pr ? ' #' + repo.pr : '';
    if (state === 'prod') {
      return { cls: 'ok', text: '✔ ' + label + ' ' + (repo.prod_branch || '') + pr, title: 'mergeado na branch de producao' };
    }
    if (state === 'integration') {
      return {
        cls: 'partial',
        text: '◐ ' + label + ' ' + (repo.integration_branch || '') + ' · falta ' + (repo.prod_branch || 'release'),
        title: 'na branch de integracao, ainda sem release para producao',
      };
    }
    if (state === 'wip') {
      return { cls: 'partial', text: '◌ ' + label + ' so em branch', title: 'ha commits com o codigo, fora das branches principais' };
    }
    if (state === 'none') {
      return { cls: 'none', text: '— ' + label, title: 'nenhum commit cita este RM (a marca (RM-N) e recente)' };
    }
    return { cls: 'none', text: '? ' + label, title: 'nao foi possivel ler o repositorio' };
  }

  function renderRm(session) {
    var rmCode = session.feature && session.feature.rm;
    if (!rmCode) return null;
    var rm = session.rm || {};
    var row = document.createElement('div');
    row.className = 'rm-row';
    var html = '<span class="chip rm">RM-' + escapeHtml(rmCode) + '</span>';
    if (rm.status) {
      html += '<span class="chip ' + (RM_STATUS_CLASS[rm.status] || '') + '">' + escapeHtml(rm.status) + '</span>';
    } else if (rm.board_error) {
      html += '<span class="chip none" title="' + escapeHtml(rm.board_error) + '">board indisponivel</span>';
    }
    Object.keys(rm.repos || {}).forEach(function (label) {
      var c = repoChip(label, rm.repos[label]);
      html += '<span class="chip ' + c.cls + '" title="' + escapeHtml(c.title) + '">' + escapeHtml(c.text) + '</span>';
    });
    if (rm.complete) html += '<span class="chip complete">100% mergeado</span>';
    row.innerHTML = html;
    return row;
  }

  function renderCard(session) {
    var article = document.createElement('article');
    article.className = 'card';
    article.style.setProperty('--accent', STATUS_ACCENT_VAR[session.status] || STATUS_ACCENT_VAR.idle);

    var blipClass = STATUS_BLIP_CLASS[session.status] || 'idle';
    var statusLabel = STATUS_LABEL[session.status] || session.status || '—';
    var elapsed = window.OverwatchFormat.formatElapsed(session.started_at);
    var contextLabel =
      session.context_pct === null || session.context_pct === undefined ? '—' : session.context_pct + '%';

    var header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML =
      '<span class="blip ' + blipClass + '"></span>' +
      '<span class="project">' + escapeHtml(session.project || '—') + '</span>' +
      '<span class="sep">|</span><span>' + escapeHtml(session.branch || '—') + '</span>' +
      '<span class="sep">|</span><span>' + elapsed + '</span>' +
      '<span class="sep">|</span><span>' + contextLabel + '</span>' +
      '<span class="sep">|</span><span>' + statusLabel + '</span>' +
      (session.kind && KIND_LABEL[session.kind]
        ? '<span class="sep">|</span><span class="badge ' + escapeHtml(session.kind) + '">' +
          KIND_LABEL[session.kind] + '</span>'
        : '') +
      (session.feature && session.feature.slug
        ? '<span class="slug">' + escapeHtml(session.feature.slug) + '</span>'
        : '');
    article.appendChild(header);

    var summary = document.createElement('div');
    summary.className = 'card-summary';
    summary.textContent = session.summary || '(sem prompt ainda)';
    article.appendChild(summary);

    var rmRow = renderRm(session);
    if (rmRow) article.appendChild(rmRow);

    if (Array.isArray(session.flow) && session.flow.length > 0) {
      article.appendChild(renderFlow(session.flow));
    }

    var lastSkill = Array.isArray(session.skills) && session.skills.length > 0
      ? session.skills[session.skills.length - 1]
      : null;
    if (lastSkill) {
      var skillLine = document.createElement('div');
      skillLine.className = 'meta-line';
      skillLine.innerHTML = 'skill: <b>' + escapeHtml(lastSkill.name) + '</b>';
      article.appendChild(skillLine);
    }

    if (Array.isArray(session.agents) && session.agents.length > 0) {
      article.appendChild(renderAgents(session.agents));
    }

    if (Array.isArray(session.todos) && session.todos.length > 0) {
      var overall = window.OverwatchFormat.computeOverallProgress(session.todos);
      var overallPct = overall.total > 0 ? Math.round((overall.done / overall.total) * 100) : 0;

      var bar = document.createElement('div');
      bar.className = 'overall-bar';
      bar.innerHTML = '<i style="width:' + overallPct + '%"></i>';
      article.appendChild(bar);

      var ul = document.createElement('ul');
      ul.className = 'todos';
      session.todos.forEach(function (todo) {
        ul.appendChild(renderTodoItem(todo));
      });
      article.appendChild(ul);
    }

    return article;
  }

  function render(sessions) {
    var ids = Object.keys(sessions || {});
    activeGrid.innerHTML = '';
    archivedGrid.innerHTML = '';

    if (ids.length === 0) {
      emptyState.hidden = false;
      emptyState.textContent = 'Nenhuma sessao registrada ainda.';
      archivedSection.hidden = true;
      return;
    }

    var now = Date.now();
    var activeCount = 0;
    var archivedCount = 0;

    ids.forEach(function (id) {
      var session = sessions[id];
      var expired = session.status === 'ended' || window.OverwatchFormat.isExpired(session.last_update, now);
      var card = renderCard(session);
      if (expired) {
        archivedGrid.appendChild(card);
        archivedCount++;
      } else {
        activeGrid.appendChild(card);
        activeCount++;
      }
    });

    archivedSection.hidden = archivedCount === 0;
    if (activeCount === 0 && archivedCount > 0) {
      emptyState.hidden = false;
      emptyState.textContent = 'Nenhuma sessao ativa no momento.';
    } else {
      emptyState.hidden = true;
    }
  }

  function reloadSessionsScript() {
    var old = document.getElementById('sessions-data-script');
    if (old) old.remove();
    var script = document.createElement('script');
    script.id = 'sessions-data-script';
    script.src = window.OVERWATCH_DATA_URL + '?t=' + Date.now();
    script.onload = function () {
      render(window.CLAUDE_SESSIONS || {});
    };
    script.onerror = function () {
      render({});
    };
    document.body.appendChild(script);
  }

  if (!window.OVERWATCH_DATA_URL) {
    configMissing.hidden = false;
  } else {
    reloadSessionsScript();
    setInterval(reloadSessionsScript, POLL_MS);
  }
})();
</script>
</body>
</html>
